pos_trans:
  ros__parameters:

    # =========================================================
    # NED 좌표계 원점 (LLA)
    # 모든 NED 좌표 변환의 기준점이 되는 위/경도/고도
    # =========================================================
    origin.latitude: 36.395991    # 원점 위도 [deg]
    origin.longitude: 127.401794  # 원점 경도 [deg]
    origin.altitude: 25.1110      # 원점 고도 [m, WGS84 기준]


path_planner_node:
  ros__parameters:

    # =========================================================
    # System
    # =========================================================
    sys.node_period_sec: 0.05       # 제어 루프 주기 [sec] → 20Hz

    # =========================================================
    # Vehicle
    # =========================================================
    robot.max_speed_m_s: 1.8        # USV 최대 전진 속도 [m/s]
    robot.max_yaw_rate_deg_s: 90.0  # USV 최대 선회 각속도 [deg/s]
    robot.safety_radius_m: 0.80     # 충돌 판정 안전 반경 [m] (arc 경로와 장애물 간 최소 거리)

    # =========================================================
    # Arc Planner
    # =========================================================
    plan.sim_time_sec: 3.0          # arc 시뮬레이션 예측 시간 [sec] (얼마나 앞을 볼지)
    plan.dt_sec: 0.2                # arc 시뮬레이션 적분 시간 간격 [sec]
    plan.arc_count: 20              # 후보 arc(yaw rate) 샘플링 개수 [개] (많을수록 정밀하나 연산 증가)
    plan.goal_path_resolution_m: 0.2  # goal 직선 경로 샘플링 간격 [m] (충돌 체크 정밀도)

    # =========================================================
    # LiDAR
    # =========================================================
    lidar.ignore_radius_m: 0.25    # USV 본체로 인한 self-detection 무시 반경 [m]
    lidar.front_angle_deg: 90.0   # 전방 장애물 감지 범위 [deg] (±30° → 정면 60° 이내)

    # =========================================================
    # Recovery (장애물로 인한 회피 불가 시 복구 동작)
    # =========================================================
    recovery.front_obstacle_threshold_m: 0.6  # 전방 장애물이 이 거리 이하이면 HOLDING 진입 [m]
    recovery.clear_distance_m: 0.7           # 복구 완료 판정 기준 전방 여유 거리 [m]
    recovery.reverse_speed_m_s: -2.3          # REVERSING 상태에서 후진 속도 [m/s] (음수=후진)

    # =========================================================
    # Cost Function (arc 선택 점수 가중치)
    # =========================================================
    weights.goal_align: 1.0   # goal 방향 정렬 점수 가중치 (클수록 goal 방향 arc 우선 선택)

    # =========================================================
    # Debug
    # =========================================================
    debug.enabled: true   # RViz 디버그 마커 퍼블리시 여부 (arc, 장애물, 복구상태 시각화)


cmd_msg_pub_px4:
  ros__parameters:

    # =========================================================
    # Publish Timer
    # =========================================================
    timer_period: 0.02   # PX4 Offboard 메시지 발행 주기 [sec] → 50Hz
                         # PX4는 2Hz 이상 수신 시 Offboard 모드 유지 (50Hz는 충분한 여유)

dummy_state_pub_node:
  ros__parameters:
    goal.north_m: -5.0
    goal.east_m: 0.0
    heading.rad: 0.0
    timer_period: 0.1