# =============================================================================
# usv_params.yaml — auto_usv_pkg 전체 파라미터 설정
#
# 노드별 파라미터 그룹
#   pos_trans                : NED 원점 좌표 (필드 운용 전 반드시 수정)
#   collision_avoidance_node : 아크 기반 충돌 회피 플래너
#   cmd_msg_pub_px4          : PX4 Offboard 명령 발행
#   dummy_state_pub_node     : 오프라인/실내 테스트용 가상 상태 발행
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
pos_trans:
  ros__parameters:

    # NED 좌표계 원점 (LLA)
    # ECEF → NED 변환의 기준점. 실제 운용 장소로 반드시 변경 필요.
    origin.latitude:  36.395991   # 원점 위도  [deg]
    origin.longitude: 127.401794  # 원점 경도  [deg]
    origin.altitude:  25.1110     # 원점 고도  [m, WGS84]


# ─────────────────────────────────────────────────────────────────────────────
collision_avoidance_node:
  ros__parameters:

    # ── System ───────────────────────────────────────────────────────────────
    sys.rate_hz: 20.0
    # 제어 루프 주기 [Hz]
    # ↑ 반응 빠름 / CPU 증가   ↓ CPU 감소 / 반응 느림
    # ⚠️ LiDAR 발행 주기(보통 10~20 Hz)보다 높여도 실질적 이득 없음

    sys.sensor_timeout_sec: 0.5
    # 센서(위치·헤딩·스캔) 입력 stale 판정 시간 [s].
    # 마지막 수신 후 이 시간 초과 시 옛 데이터 주행을 막고 정지 명령 발행.
    # ↑ 끊김에 관대 (오탐 감소)   ↓ 빠른 정지 (안전 우선)

    # ── Robot ────────────────────────────────────────────────────────────────
    robot.max_speed_m_s: 1.5
    # 최대 전진 속도 [m/s]
    # ↑ 빠른 이동 / 아크 판정 범위 자동 증가
    # ↓ 느린 이동 / 좁은 공간 여유 증가
    # ※ LiDAR 유효 범위 = max_speed × sim_time + 2 m 로 자동 결정

    robot.max_yaw_rate_deg_s: 55.0
    # 최대 선회 각속도 [deg/s]. 후보 아크를 ±max 범위에서 arc_count 개로 샘플링.
    # ↑ 급격한 방향 전환 가능 (좁은 공간 유리)
    # ↓ 완만한 선회 (고속 안정성 향상)

    robot.safety_radius_m: 0.35
    # 아크-장애물 간 최소 허용 거리 [m]. 미만이면 충돌 판정.
    # ↑ 넓은 안전 간격 / 통과 가능 공간 감소
    # ↓ 좁은 공간 통과 가능 / 여유 감소

    # ── Arc Planner ──────────────────────────────────────────────────────────
    plan.sim_time_sec: 2.5
    # 아크 예측 시간 [s]. 예측 거리 ≈ max_speed × sim_time.
    # ↑ 멀리 예측 / 좁은 실내에서 모든 아크가 막힐 수 있음
    # ↓ 짧게 예측 / 실내·좁은 공간 테스트 시 1.0~2.0 권장

    plan.sim_steps: 15
    # 아크 적분 스텝 수. dt = sim_time / sim_steps (현재 0.2 s/step).
    # ↑ 충돌 체크 정밀도 향상 / 연산량 증가
    # ↓ 연산 빠름 / 정밀도 감소

    plan.arc_count: 21
    # 후보 아크(yaw rate) 샘플 수. 홀수 → 0(직진) 포함.
    # ↑ 세밀한 방향 선택 / 연산량 증가
    # ↓ 연산 빠름 / 최적 경로 누락 가능

    plan.hysteresis_margin: 0.10
    # 회피 아크 전환 임계. 직전에 고른 아크가 여전히 안전하면, 새 후보가 이 값보다
    # 확실히 더 좋을 때만 전환 → 정면 대칭 장애물에서 좌/우 떨림(채터링) 억제.
    # ↑ 더 끈질기게 유지(안정·반응 느림)   ↓ 민감하게 전환(반응 빠름·떨림 가능)

    plan.clearance_weight: 0.30
    # 아크 점수에 더하는 '장애물 여유(clearance)' 가중치.
    # 목표정렬이 비슷한 아크 중 장애물에서 더 멀리 떨어진 쪽을 선호 → 덜 아슬하게 회피.
    # ↑ 여유 우선(둘러감)   ↓ 목표 직진 우선(바짝 붙음)   0 = 기존(목표정렬만)

    plan.clearance_scale_m: 3.0
    # clearance 정규화 스케일 [m]. 안전반경 초과 여유가 이 값이면 가중치 만점.

    # ── Hold Mode ────────────────────────────────────────────────────────────
    hold.clear_m: 1.0
    # HOLD MODE 이탈 트리거 거리 [m].
    # 최근접 장애물이 이 값 이내로 접근하면 이탈 기동 시작.
    # ↑ 멀리서 이탈 시작 (안전)   ↓ 더 가까워야 이탈 (공간 효율)

    hold.escape_speed_m_s: 0.5
    # HOLD MODE 이탈 속도 [m/s]. 장애물 무게중심 반대 방향으로 이 속도로 이동.

    # ── LiDAR ────────────────────────────────────────────────────────────────
    lidar.ignore_radius_m: 0.4
    # 자기 감지 무시 반경 [m]. 이내 포인트는 본체로 간주해 제외.
    # ↑ 넓게 무시 / 가까운 실제 장애물 누락 가능
    # ↓ 좁게 무시 / 본체 구조물 오인식 가능

    lidar.cluster_min_points: 3
    # 유효 장애물로 인정할 최소 연속 포인트 수.
    # 이 값 미만 묶음은 노이즈로 제거. 1 = 클러스터 필터 비활성화.

    lidar.cluster_max_gap_m: 0.45
    # 같은 클러스터로 묶을 최대 포인트 간 거리 [m].
    # ↑ 넓게 묶음 (큰 물체 인식 유리)   ↓ 엄격히 분리 (물체 끊김 가능)


# ─────────────────────────────────────────────────────────────────────────────
collision_avoidance_node_livox:
  ros__parameters:

    # ── System ───────────────────────────────────────────────────────────────
    sys.rate_hz: 20.0
    sys.sensor_timeout_sec: 0.5   # 센서 입력 stale 판정 시간 [s] (초과 시 정지)

    # ── Robot ────────────────────────────────────────────────────────────────
    robot.max_speed_m_s:       1.5
    robot.max_yaw_rate_deg_s: 55.0
    robot.safety_radius_m:     0.50

    # ── Arc Planner ──────────────────────────────────────────────────────────
    plan.sim_time_sec: 3.0
    plan.sim_steps:   15
    plan.arc_count:   21
    plan.hysteresis_margin: 0.10   # 회피 아크 전환 임계(클수록 떨림↓·반응↓)
    plan.clearance_weight:  0.30   # 여유(clearance) 선호 가중치(0=목표정렬만)
    plan.clearance_scale_m: 3.0    # clearance 정규화 스케일 [m]

    # ── Hold Mode ────────────────────────────────────────────────────────────
    hold.clear_m:          1.0
    hold.escape_speed_m_s: 0.6

    # ══════════════════════════════════════════════════════════════════════════
    #  Livox PointCloud2 필터  (pointcloud_to_laserscan 없이 /livox/lidar 직접 처리)
    # ──────────────────────────────────────────────────────────────────────────
    #  처리 파이프라인 (collision_avoidance_node_livox.pointcloud_to_points):
    #    1) NaN/Inf 제거
    #    2) 높이 coarse 밴드  [min_height, max_height]  — 명백한 하부/상부만 컷
    #    3) 수평 거리 필터     [ignore_radius, max_range(자동)]
    #    4) 전방 FOV 필터      ±angle_half_fov
    #    5) 지면/수면 제거      격자별 수직 구조 (ground_grid > 0)
    #    6) 복셀 다운샘플       밀도 균일화 (voxel_size > 0, 선택)
    #    7) 클러스터 필터       고립 노이즈 제거
    #
    #  땅/물이 찍히는 문제는 주로 5)번이 담당. 2)번 높이 밴드는 거친 1차 컷이고,
    #  실제 지면 분리는 5)번(국소 수직 분포 판정)이 선체 기울기에도 견고하게 처리.
    # ══════════════════════════════════════════════════════════════════════════

    # ── (3) 거리 ───────────────────────────────────────────────────────────────
    lidar.ignore_radius_m: 0.3      # 센서 근접 노이즈 무시 반경 [m] (본체 자기반사 컷)

    # ── (2) 높이 coarse 밴드 ───────────────────────────────────────────────────
    lidar.min_height_m:   -0.1      # 하한 [m] — 이보다 낮은 점은 즉시 제거
    lidar.max_height_m:    1.0      # 상한 [m] — 이보다 높은 점(상부 구조물 등) 제거

    # ── (4) 전방 FOV ──────────────────────────────────────────────────────────
    lidar.angle_half_fov_deg: 75.0  # 전방 FOV 반각 [deg] → ± 적용 (90 → -90°~+90°)

    # ── (7) 클러스터 ──────────────────────────────────────────────────────────
    lidar.cluster_min_points: 2     # 유효 클러스터 최소 연속 포인트 수 (미만은 노이즈)
    lidar.cluster_max_gap_m:  0.45  # 같은 클러스터로 묶을 최대 포인트 간격 [m]

    # ── (5) 지면/수면 제거 — 격자별 수직 구조 필터 ───────────────────────────────
    # XY 격자 셀 단위로 z 높이차(zmax−zmin)를 검사:
    #   (zmax−zmin) ≥ ground_vert_min  또는  zmax ≥ ground_top_min  → 장애물 셀로 보고
    #   그 셀의 모든 포인트 유지(기둥 밑동까지). 그 외(평평·얇은 면=땅·물)는 제거.
    # 절대 높이가 아닌 '국소 수직 분포'로 판정 → 선체 pitch/roll 에 견고.
    lidar.ground_grid_m:     0.0    # 격자 셀 크기 [m]. 0 = 지면 필터 비활성(기존 동작)
    lidar.ground_vert_min_m: 0.12    # 장애물 인정 최소 수직 높이차 [m]
    lidar.ground_top_min_m:  0.5    # 보조: 셀 최고점 z 가 이 값 이상이면 유지 [m, 센서 프레임]

    # ── (6) 복셀 다운샘플 (선택) ──────────────────────────────────────────────
    lidar.voxel_size_m: 0.0         # 복셀 셀당 1점만 남겨 밀도 균일화. 0=비활성, 권장 0.1

    # ── 튜닝 빠른참조 (증상 → 조치) ───────────────────────────────────────────
    #   땅/물이 아직 남음         : ground_vert_min_m ↑ (0.2→0.3)  또는 ground_grid_m ↓ (0.5→0.3)
    #   낮은 실제 장애물이 사라짐  : ground_vert_min_m ↓ (0.2→0.12)
    #   키 큰 물체를 더 확실히 잡기 : ground_top_min_m 을 '수면 위로 확실히 올라온 높이'로 설정
    #   장애물 표현 더 선명하게    : voxel_size_m: 0.1 켜기
    #   지면 필터 완전히 끄기      : ground_grid_m: 0.0
    #   ※ 실 bag 재생하며 RViz 의 노란 장애물 마커를 보고 ground_vert_min_m 한두 번 조정 권장


# ─────────────────────────────────────────────────────────────────────────────
cmd_msg_pub_px4:
  ros__parameters:

    timer_period: 0.02
    # PX4 Offboard 메시지 발행 주기 [s] → 50 Hz
    # ⚠️ PX4는 2 Hz 이상 수신해야 Offboard 모드 유지 (50 Hz는 충분한 여유)


# ─────────────────────────────────────────────────────────────────────────────
dummy_state_pub_node:
  ros__parameters:

    # ── 이동 시나리오 ──────────────────────────────────────────────────────────
    mode: static
    # static     원점 고정, 헤딩 고정, 단일 목표
    # moving     /vfh/command 구독 → 위치·헤딩 실시간 적분 (closed-loop 테스트)
    # rotating   헤딩이 일정 속도로 회전
    # waypoints  경유점 배열 순회, 도달 시 자동 다음 목표
    # no_goal    goal 토픽 미발행 → HOLD MODE 테스트

    rate_hz: 20.0             # 발행 주기 [Hz]

    init.north_m:    0.0      # 초기 북쪽 위치 [m]
    init.east_m:     0.0      # 초기 동쪽 위치 [m]
    init.heading_rad: 0.0     # 초기 헤딩 [rad, NED CW]  0=정북  π/2≈1.5708=정동

    goal.north_m: 5.0         # 목표 북쪽 [m]  (static / moving / rotating 공통)
    goal.east_m:  0.0         # 목표 동쪽 [m]

    rotate.rate_deg_s: 10.0   # rotating 모드 헤딩 회전 속도 [deg/s]

    waypoints: [5.0, 0.0,  5.0, 5.0,  0.0, 5.0,  0.0, 0.0]
    # waypoints 모드 경유점: [n0, e0, n1, e1, ...] 순환
    # 기본값: 5 m 정사각형 루프

    waypoint.threshold_m: 0.5   # 경유점 도달 판정 거리 [m]

    # ── 장애물 시나리오 ────────────────────────────────────────────────────────
    obstacle.mode: none
    # none        장애물 없음
    # fixed       지정 각도·거리·폭의 고정 장애물 (여러 개 가능)
    # approaching 정면에서 접근하는 장애물, 일정 거리 이내 리셋
    # wall        정면에 넓은 벽 장애물
    # surround    사방 포위, 전방만 열림

    obstacle.fixed: [0.0, 3.0, 10.0]
    # fixed 모드: [각도_deg, 거리_m, 폭_deg, ...] 반복
    # 예) 정면 3 m 폭 10°, 우 45° 2 m 폭 8°
    #     [0.0, 3.0, 10.0,  45.0, 2.0, 8.0]

    obstacle.approach.angle_deg: 0.0    # 접근 방향 [deg]  0 = 정면
    obstacle.approach.start_m:   8.0    # 접근 시작 거리 [m]
    obstacle.approach.speed_mps: 0.4    # 접근 속도 [m/s]
    obstacle.approach.reset_m:   0.4    # 리셋 트리거 거리 [m]

    obstacle.wall.angle_deg: 0.0        # 벽 방향 [deg]
    obstacle.wall.dist_m:    2.5        # 벽까지 거리 [m]
    obstacle.wall.width_deg: 80.0       # 벽 폭 [deg]

    obstacle.surround.dist_m:  2.0      # 포위 장애물 거리 [m]
    obstacle.surround.gap_deg: 30.0     # 전방 열린 구간 ±각도 [deg]

    scan.resolution_deg: 1.0            # 각도 해상도 [deg/beam]
    scan.range_max_m:   12.0            # 최대 감지 거리 [m]
